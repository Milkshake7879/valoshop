# Deployed as a Cloudflare Pages project: public/ is served as static files and
# functions/api/[[path]].js handles /api/*. Lives at https://valoshop.pages.dev
name = "valoshop"
pages_build_output_dir = "./public"
compatibility_date = "2025-09-01"

# The only thing the site stores: a global count of shops checked
# (migrations/0001_counters.sql). Nothing about who checked.
[[d1_databases]]
binding = "DB"
database_name = "valoshop"
database_id = "edf0203c-4982-44c4-bd6d-e4913ee674f5"
